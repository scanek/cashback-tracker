services:
  cashback-hub-server:
    image: ghcr.io/scanek/cashback-tracker-server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cashback-hub-server
    restart: always
    ports:
      - "4000:4000"
    volumes:
      - ./server/data:/app/data
    environment:
      - PORT=4000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

  cashback-hub-web:
    image: ghcr.io/scanek/cashback-tracker-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cashback-hub-web
    restart: always
    ports:
      - "${PORT:-8085}:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - cashback-hub-server

  # Автоматическое фоновое обновление контейнеров при публикации новых образов в GitHub
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: cashback-hub-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=300 # Проверка каждые 5 минут
      - WATCHTOWER_CLEANUP=true      # Авто-удаление старых образов для экономии диска
      - WATCHTOWER_INCLUDE_RESTARTING=true
    command: cashback-hub-web cashback-hub-server
