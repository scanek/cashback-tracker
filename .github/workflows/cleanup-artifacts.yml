name: 🧹 Clean Old Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: 🗑️ Purge Old Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Run Artifact Cleanup Script
        uses: actions/github-script@v7
        with:
          script: |
            let totalDeleted = 0;
            while (true) {
              const res = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              if (!res.data.artifacts || res.data.artifacts.length === 0) {
                break;
              }
              for (const artifact of res.data.artifacts) {
                console.log(`Deleting artifact ${artifact.id}: ${artifact.name} (${Math.round(artifact.size_in_bytes / 1024 / 1024)} MB)...`);
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                  });
                  totalDeleted++;
                } catch (e) {
                  console.error(`Failed to delete ${artifact.id}: ${e.message}`);
                }
              }
              if (res.data.artifacts.length < 100) {
                break;
              }
            }
            console.log(`🎉 Cleanup complete! Total deleted artifacts: ${totalDeleted}`);
